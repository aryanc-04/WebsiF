<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Filter - Blocklist</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="panel">
        <h1>Custom Blocklist</h1>
        <p class="subtitle">
          Words you add here get combined with base blocklist. Please click update list button after adding.
        </p>

        <div class="add-row">
            <label for="wordInput" class="visually-hidden">Word to add</label>
            <input id="wordInput" type="text" placeholder="add a word...">
            <button id="addButton" type="button">Add</button>
        </div>

        <ul id="wordList" class="word-list"></ul>
        <p id="emptyMessage" class="empty-message">no custom words yet</p>

        <button id="updateListButton" type="button" class="rebuild-button">
            Update List</button>

        <p id="status" class="status">ready</p>

    </main>
    <script src="../src/blocklist/customBlocklist.js"></script>
    <script src="options.js"></script>
</body>
</html>
